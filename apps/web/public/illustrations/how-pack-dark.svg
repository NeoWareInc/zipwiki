<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="hp-title hp-desc" font-family="Sora, 'Segoe UI', system-ui, sans-serif">
  <title id="hp-title">How a .zipwiki package is packed</title>
  <desc id="hp-desc">A folder of mixed documents (PDF, Word, spreadsheets, PowerPoint and scans) is parsed once into markdown by the Parser (with OCR for scans). An LLM writes an OKF card per document, an index and a package digest. Origin links are attached, and everything is sealed into one .zipwiki with a manifest, the OKF index, extracted markdown and optional originals, compressed with zstd.</desc>
  <defs>
    <linearGradient id="hp-sky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f2229"/><stop offset=".45" stop-color="#101a21"/><stop offset="1" stop-color="#221e17"/></linearGradient>
    <radialGradient id="hp-sun" cx=".05" cy=".1" r=".45"><stop offset="0" stop-color="#4ecdc4" stop-opacity=".16"/><stop offset="1" stop-color="#4ecdc4" stop-opacity="0"/></radialGradient>
    <linearGradient id="hp-desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3226"/><stop offset="1" stop-color="#2b251c"/></linearGradient>
    <linearGradient id="hp-machine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4552"/><stop offset="1" stop-color="#1f3a44"/>
    </linearGradient>
    <linearGradient id="hp-crate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1aa59e"/><stop offset="1" stop-color="#0f6e6a"/>
    </linearGradient>
    <linearGradient id="hp-crate-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c5a57"/><stop offset="1" stop-color="#0f6e6a"/>
    </linearGradient>
    <linearGradient id="hp-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc28a"/><stop offset="1" stop-color="#2f8f5b"/>
    </linearGradient>
    <linearGradient id="hp-mug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dfe7ea"/>
    </linearGradient>
    <filter id="hp-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f3a44" flood-opacity=".16"/>
    </filter>
    <filter id="hp-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1f3a44" flood-opacity=".14"/>
    </filter>
    <marker id="hp-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#14948e"/>
    </marker>
    <!-- generic doc with colored tag -->
    <symbol id="hp-doc" viewBox="0 0 66 84">
      <path d="M6 0 h44 l16 16 v62 a6 6 0 0 1 -6 6 H6 a6 6 0 0 1 -6 -6 V6 a6 6 0 0 1 6 -6 z" fill="#fff"/>
      <path d="M50 0 v12 a4 4 0 0 0 4 4 h12" fill="#e7e0d1"/>
      <rect x="7" y="32" width="50" height="4" rx="2" fill="#c5d2d8"/><rect x="7" y="41" width="42" height="4" rx="2" fill="#c5d2d8"/><rect x="7" y="50" width="48" height="4" rx="2" fill="#c5d2d8"/><rect x="7" y="59" width="36" height="4" rx="2" fill="#c5d2d8"/>
    </symbol>
    <symbol id="hp-md" viewBox="0 0 70 86">
      <rect width="70" height="86" rx="7" fill="#fff"/>
      <path d="M7 0 h56 a7 7 0 0 1 7 7 v9 H0 v-9 a7 7 0 0 1 7 -7 z" fill="#0f6e6a"/>
      <text x="8" y="12" font-size="8" font-weight="700" fill="#fff" font-family="'JetBrains Mono', ui-monospace, monospace">.md</text>
      <text x="8" y="32" font-size="9" font-weight="700" fill="#0f6e6a" font-family="'JetBrains Mono', ui-monospace, monospace">#</text>
      <rect x="18" y="26" width="40" height="5" rx="2.5" fill="#15202b"/>
      <rect x="8" y="40" width="54" height="4" rx="2" fill="#c5d2d8"/><rect x="8" y="49" width="46" height="4" rx="2" fill="#c5d2d8"/>
      <rect x="8" y="60" width="54" height="14" rx="2" fill="none" stroke="#9fb4bd"/><path d="M26 60 v14 M44 60 v14" stroke="#9fb4bd"/>
    </symbol>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#hp-sky)"/><g fill="#fff" opacity=".55"><circle cx="90" cy="40" r="1.2"/><circle cx="180" cy="96" r="1"/><circle cx="340" cy="30" r="1.4"/><circle cx="470" cy="70" r="1"/><circle cx="560" cy="22" r="1.1"/><circle cx="700" cy="50" r="1.3"/><circle cx="820" cy="28" r="1"/><circle cx="960" cy="60" r="1.2"/><circle cx="1080" cy="34" r="1.4"/><circle cx="1150" cy="90" r="1"/></g>
  <rect width="1200" height="420" rx="28" fill="url(#hp-sun)"/>
  <g fill="#9fb4bd" opacity=".10">
    <ellipse cx="470" cy="46" rx="66" ry="13"/><ellipse cx="512" cy="38" rx="40" ry="15"/>
    <ellipse cx="900" cy="58" rx="52" ry="11"/>
  </g>
  <path d="M0 290 Q600 270 1200 290 V392 a28 28 0 0 1 -28 28 H28 a28 28 0 0 1 -28 -28 z" fill="url(#hp-desk)"/>
  <path d="M0 290 Q600 270 1200 290" fill="none" stroke="#4a3f2f" stroke-width="2"/>

  <!-- header -->
  <rect x="40" y="26" width="92" height="28" rx="14" fill="#2a4552" stroke="#5a7884"/>
  <text x="86" y="45" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2.5" fill="#fff">PACK</text>
  <text x="148" y="45" font-size="14" fill="#c5d2d8">Parse once, index once—both travel inside one portable file.</text>

  <!-- arrows -->
  <g fill="none" stroke="#14948e" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#hp-arrow)">
    <path d="M222 214 C 236 190, 250 190, 262 204"/>
    <path d="M454 214 C 468 190, 482 190, 494 204"/>
    <path d="M700 214 C 714 190, 728 190, 740 204"/>
    <path d="M896 214 C 910 190, 924 190, 936 204"/>
  </g>

  <!-- ===== 1 SOURCE PILE ===== -->
  <g transform="translate(30 92)">
    <!-- mug -->
    <g transform="translate(180 158)">
      <path d="M2 4 h34 v34 a8 8 0 0 1 -8 8 h-18 a8 8 0 0 1 -8 -8 z" fill="url(#hp-mug)"/>
      <path d="M36 12 a9 9 0 0 1 0 18" fill="none" stroke="#dfe7ea" stroke-width="5"/>
      <ellipse cx="19" cy="5" rx="17" ry="4" fill="#7a4a2a"/>
      <path d="M12 -6 q4 -6 0 -12 M22 -4 q4 -6 0 -12" stroke="#c5d2d8" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <g filter="url(#hp-soft)">
      <g transform="translate(96 100) rotate(9)">
        <rect width="78" height="92" rx="4" fill="#fbf7ee"/>
        <rect x="6" y="6" width="66" height="62" fill="#e9dcc3"/>
        <rect x="12" y="14" width="44" height="4" rx="2" fill="#a8977a"/><rect x="12" y="24" width="52" height="4" rx="2" fill="#a8977a"/><rect x="12" y="34" width="38" height="4" rx="2" fill="#a8977a"/>
        <circle cx="54" cy="52" r="11" fill="none" stroke="#c0392b" stroke-width="2" opacity=".7"/>
        <text x="39" y="84" font-size="8" font-weight="700" fill="#8a6d3b" text-anchor="middle">SCAN.jpg</text>
      </g>
      <g transform="translate(18 104) rotate(-8)">
        <use href="#hp-doc" width="66" height="84"/>
        <rect x="7" y="10" width="30" height="13" rx="3" fill="#1e8e4f"/><text x="22" y="20" font-size="7.5" font-weight="800" fill="#fff" text-anchor="middle">XLSX</text>
      </g>
      <g transform="translate(130 14) rotate(11)">
        <use href="#hp-doc" width="66" height="84"/>
        <rect x="7" y="10" width="30" height="13" rx="3" fill="#d9662b"/><text x="22" y="20" font-size="7.5" font-weight="800" fill="#fff" text-anchor="middle">PPTX</text>
      </g>
      <g transform="translate(66 4) rotate(3)">
        <use href="#hp-doc" width="66" height="84"/>
        <rect x="7" y="10" width="30" height="13" rx="3" fill="#2b5fd9"/><text x="22" y="20" font-size="7.5" font-weight="800" fill="#fff" text-anchor="middle">DOCX</text>
      </g>
      <g transform="translate(4 20) rotate(-12)">
        <use href="#hp-doc" width="66" height="84"/>
        <rect x="7" y="10" width="28" height="13" rx="3" fill="#d64545"/><text x="21" y="20" font-size="7.5" font-weight="800" fill="#fff" text-anchor="middle">PDF</text>
      </g>
    </g>
  </g>

  <!-- ===== 2 PARSE MACHINE ===== -->
  <g transform="translate(266 80)">
    <!-- hopper -->
    <path d="M30 8 h124 l-26 40 h-72 z" fill="#c5d2d8"/>
    <path d="M30 8 h124" stroke="#9fb4bd" stroke-width="4" stroke-linecap="round"/>
    <g filter="url(#hp-shadow)">
      <rect x="10" y="46" width="164" height="168" rx="16" fill="url(#hp-machine)"/>
    </g>
    <rect x="24" y="60" width="136" height="20" rx="10" fill="#15202b"/>
    <text x="92" y="74" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.2" fill="#4ecdc4">PARSE → MARKDOWN</text>
    <!-- engine chips -->
    <g font-size="9" font-weight="700">
      <g transform="translate(24 100)"><rect width="136" height="28" rx="7" fill="#e6fbf9"/><circle cx="14" cy="14" r="5" fill="#14948e"/><text x="26" y="18" fill="#0f6e6a">Parser</text><text x="128" y="18" font-weight="400" font-size="8" text-anchor="end" fill="#5a6b78">markdown</text></g>
      <g transform="translate(24 140)"><rect width="136" height="28" rx="7" fill="#fbf1df"/><circle cx="14" cy="14" r="5" fill="#a8977a"/><text x="26" y="18" fill="#7a5a2a">OCR</text><text x="128" y="18" font-weight="400" font-size="8" text-anchor="end" fill="#5a6b78">scans</text></g>
    </g>
    <!-- out chute -->
    <path d="M174 170 h14 v30 h-14" fill="#2a4552"/>
  </g>

  <!-- ===== 3 MARKDOWN + OKF ===== -->
  <g transform="translate(498 74)">
    <!-- md stack -->
    <g filter="url(#hp-soft)">
      <use href="#hp-md" x="18" y="30" width="70" height="86" transform="rotate(-8 53 73)"/>
      <use href="#hp-md" x="34" y="24" width="70" height="86"/>
    </g>
    <text x="70" y="128" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0f6e6a" font-family="'JetBrains Mono', ui-monospace, monospace">wiki/parsed/</text>
    <!-- OKF card being written -->
    <g transform="translate(108 8)" filter="url(#hp-shadow)">
      <rect width="92" height="116" rx="8" fill="#fffdf8" stroke="#e0a54b" stroke-width="2"/>
      <text x="10" y="18" font-size="8" font-weight="700" letter-spacing="1" fill="#b45309">OKF CARD</text>
      <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5">
        <text x="10" y="36" fill="#5a6b78">title:</text><rect x="38" y="31" width="44" height="5" rx="2.5" fill="#15202b"/>
        <text x="10" y="50" fill="#5a6b78">type:</text><rect x="38" y="45" width="34" height="5" rx="2.5" fill="#b45309"/>
        <text x="10" y="64" fill="#5a6b78">tags:</text><rect x="38" y="59" width="40" height="5" rx="2.5" fill="#d9c8a9"/>
        <text x="10" y="78" fill="#5a6b78">facts:</text><rect x="42" y="73" width="38" height="5" rx="2.5" fill="#d9c8a9"/>
        <text x="10" y="92" fill="#5a6b78">origin:</text><rect x="46" y="87" width="36" height="5" rx="2.5" fill="#1d4ed8"/>
      </g>
    </g>
    <!-- pen with sparkle -->
    <g transform="translate(188 92) rotate(35)">
      <rect x="-5" y="-40" width="10" height="44" rx="3" fill="#1f3a44"/>
      <path d="M-5 4 h10 l-5 12 z" fill="#ffd27a"/>
      <rect x="-5" y="-40" width="10" height="8" fill="#14948e"/>
    </g>
    <path d="M214 60 Q216 70 226 72 Q216 74 214 84 Q212 74 202 72 Q212 70 214 60 z" fill="#ffc94d"/>
    <!-- index + digest -->
    <g transform="translate(20 150)" filter="url(#hp-soft)">
      <rect width="96" height="34" rx="8" fill="#fff"/>
      <rect x="8" y="8" width="18" height="18" rx="4" fill="#fde9c8"/>
      <path d="M12 13 h10 M12 17 h10 M12 21 h6" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/>
      <text x="32" y="16" font-size="8.5" font-weight="700" fill="#15202b">index.md</text>
      <text x="32" y="27" font-size="7.5" fill="#5a6b78">every concept</text>
    </g>
    <g transform="translate(124 150)" filter="url(#hp-soft)">
      <rect width="88" height="34" rx="8" fill="#fff"/>
      <rect x="8" y="8" width="18" height="18" rx="4" fill="#dff0ef"/>
      <path d="M17 11 Q18.2 15.8 23 17 Q18.2 18.2 17 23 Q15.8 18.2 11 17 Q15.8 15.8 17 11 z" fill="#14948e"/>
      <text x="32" y="16" font-size="8.5" font-weight="700" fill="#15202b">digest</text>
      <text x="32" y="27" font-size="7.5" fill="#5a6b78">what's inside</text>
    </g>
  </g>

  <!-- ===== 4 ORIGINS ===== -->
  <g transform="translate(744 86)">
    <!-- tsv sheet -->
    <g filter="url(#hp-shadow)">
      <rect x="0" y="20" width="140" height="120" rx="10" fill="#fff"/>
    </g>
    <path d="M10 20 h120 a10 10 0 0 1 10 10 v8 H0 v-8 a10 10 0 0 1 10 -10 z" fill="#1d4ed8"/>
    <text x="10" y="33" font-size="8" font-weight="700" fill="#fff" font-family="'JetBrains Mono', ui-monospace, monospace">.zipwiki-origins.tsv</text>
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="7.5">
      <text x="10" y="56" fill="#15202b">Ch_2025-001</text><text x="70" y="56" fill="#1d4ed8">→ /2025/1</text>
      <text x="10" y="72" fill="#15202b">Ch_2025-042</text><text x="70" y="72" fill="#1d4ed8">→ /2025/42</text>
      <text x="10" y="88" fill="#15202b">Ch_2024-168</text><text x="70" y="88" fill="#1d4ed8">→ /2024/168</text>
    </g>
    <rect x="10" y="100" width="120" height="1" fill="#e4ecee"/>
    <text x="10" y="118" font-size="8" fill="#5a6b78">never packed itself</text>
    <!-- luggage tag -->
    <g transform="translate(70 150) rotate(-6)" filter="url(#hp-soft)">
      <path d="M0 0 h86 a8 8 0 0 1 8 8 v24 a8 8 0 0 1 -8 8 h-86 l-14 -20 z" fill="#ffd27a"/>
      <circle cx="-2" cy="20" r="3.5" fill="#fffaf1"/>
      <path d="M-2 20 C -30 10, -40 -10, -56 -30" stroke="#a8977a" stroke-width="1.5" fill="none"/>
      <text x="8" y="17" font-size="8" font-weight="700" fill="#7a3e06">origin</text>
      <text x="8" y="30" font-size="7.5" fill="#1d4ed8" font-family="'JetBrains Mono', ui-monospace, monospace">laws.flrules.org</text>
    </g>
  </g>

  <!-- ===== 5 SEALED PACKAGE ===== -->
  <g transform="translate(944 62)">
    <!-- cutaway crate -->
    <g filter="url(#hp-shadow)">
      <path d="M10 92 L110 70 L210 92 L110 114 z" fill="#3fbdb5"/>
      <path d="M10 92 L110 114 V246 L10 224 z" fill="url(#hp-crate-side)"/>
      <path d="M210 92 L110 114 V246 L210 224 z" fill="url(#hp-crate)"/>
    </g>
    <!-- layers on front-right face -->
    <g>
      <path d="M118 124 L202 105 V125 L118 144 z" fill="#ffffff" opacity=".95"/>
      <path d="M118 150 L202 131 V151 L118 170 z" fill="#fde9c8"/>
      <path d="M118 176 L202 157 V177 L118 196 z" fill="#e6fbf9"/>
      <path d="M118 202 L202 183 V203 L118 222 z" fill="#dfe7ea" opacity=".75"/>
    </g>
    <g font-size="8" font-weight="700" font-family="'JetBrains Mono', ui-monospace, monospace">
      <text transform="translate(124 138) skewY(-12.7)" fill="#15202b">manifest</text>
      <text transform="translate(124 164) skewY(-12.7)" fill="#b45309">wiki/okf/</text>
      <text transform="translate(124 190) skewY(-12.7)" fill="#0f6e6a">wiki/parsed/</text>
      <text transform="translate(124 216) skewY(-12.7)" fill="#5a6b78">originals?</text>
    </g>
    <text transform="translate(28 168) skewY(12.7)" font-size="13" font-weight="700" fill="#dff0ef">.zipwiki</text>
    <text transform="translate(30 186) skewY(12.7)" font-size="9" fill="#9fe3dc">zstd</text>
    <!-- size badge -->
    <g transform="translate(150 22)" filter="url(#hp-soft)">
      <circle r="30" cx="30" cy="30" fill="#ffc94d"/>
      <circle r="25" cx="30" cy="30" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="30" y="30" text-anchor="middle" font-size="13" font-weight="800" fill="#7a3e06">~1%</text>
      <text x="30" y="42" text-anchor="middle" font-size="7" font-weight="700" fill="#7a3e06">of the bytes</text>
    </g>
  </g>

  <!-- step markers -->
  <g font-size="14" font-weight="700">
    <g transform="translate(128 378)"><circle r="17" fill="#fff"/><circle r="14" fill="#1f3a44"/><text y="5" text-anchor="middle" fill="#fff">1</text></g>
    <g transform="translate(358 378)"><circle r="17" fill="#fff"/><circle r="14" fill="#1f3a44"/><text y="5" text-anchor="middle" fill="#fff">2</text></g>
    <g transform="translate(610 378)"><circle r="17" fill="#fff"/><circle r="14" fill="#1f3a44"/><text y="5" text-anchor="middle" fill="#fff">3</text></g>
    <g transform="translate(818 378)"><circle r="17" fill="#fff"/><circle r="14" fill="#1f3a44"/><text y="5" text-anchor="middle" fill="#fff">4</text></g>
    <g transform="translate(1054 378)"><circle r="17" fill="#fff"/><circle r="14" fill="#1f3a44"/><text y="5" text-anchor="middle" fill="#fff">5</text></g>
  </g>
</svg>
