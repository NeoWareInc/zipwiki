<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="hq-title hq-desc" font-family="Sora, 'Segoe UI', system-ui, sans-serif">
  <title id="hq-title">How a ZipWiki query works</title>
  <desc id="hq-desc">The agent asks about homestead exemption. ZipWiki ranks OKF cards by title, type, tags and description, then scans extracted markdown at a lower weight, streams only the matching section, and returns an answer that cites the OKF card and markdown file inside the package.</desc>
  <defs>
    <linearGradient id="hq-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f5f3"/><stop offset=".6" stop-color="#f8fcfb"/><stop offset="1" stop-color="#fdf3e1"/>
    </linearGradient>
    <radialGradient id="hq-sun" cx=".1" cy=".05" r=".5">
      <stop offset="0" stop-color="#fff0c2" stop-opacity=".95"/><stop offset="1" stop-color="#fff0c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hq-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e7cf"/><stop offset="1" stop-color="#e7d4ae"/>
    </linearGradient>
    <linearGradient id="hq-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22343f"/><stop offset="1" stop-color="#15202b"/>
    </linearGradient>
    <linearGradient id="hq-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc28a"/><stop offset="1" stop-color="#2f8f5b"/>
    </linearGradient>
    <linearGradient id="hq-pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e08a5a"/><stop offset="1" stop-color="#b8603a"/>
    </linearGradient>
    <filter id="hq-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f3a44" flood-opacity=".16"/>
    </filter>
    <filter id="hq-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1f3a44" flood-opacity=".14"/>
    </filter>
    <marker id="hq-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#14948e"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#hq-sky)"/>
  <rect width="1200" height="420" rx="28" fill="url(#hq-sun)"/>
  <g opacity=".55" fill="#fff">
    <ellipse cx="560" cy="48" rx="70" ry="14"/><ellipse cx="605" cy="40" rx="42" ry="16"/>
    <ellipse cx="1010" cy="60" rx="56" ry="12"/>
  </g>
  <path d="M0 300 Q600 280 1200 300 V392 a28 28 0 0 1 -28 28 H28 a28 28 0 0 1 -28 -28 z" fill="url(#hq-desk)"/>
  <path d="M0 300 Q600 280 1200 300" fill="none" stroke="#dcc497" stroke-width="2"/>

  <!-- header ribbon -->
  <g>
    <rect x="40" y="26" width="104" height="28" rx="14" fill="#0f6e6a"/>
    <text x="92" y="45" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2.5" fill="#fff">QUERY</text>
    <text x="160" y="45" font-size="14" fill="#1f3a44">Index first, evidence second, originals never—unless you ask.</text>
  </g>

  <!-- arrows between stages -->
  <g fill="none" stroke="#14948e" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" marker-end="url(#hq-arrow)">
    <path d="M262 236 C 280 206, 300 206, 318 226"/>
    <path d="M562 236 C 580 206, 600 206, 618 226"/>
    <path d="M862 236 C 880 206, 900 206, 918 226"/>
  </g>

  <!-- ===== 1 ASK ===== -->
  <g transform="translate(40 86)">
    <!-- plant -->
    <g transform="translate(-6 160)">
      <path d="M22 70 h30 l-4 34 h-22 z" fill="url(#hq-pot)"/>
      <rect x="19" y="64" width="36" height="9" rx="3" fill="#c96e45"/>
      <path d="M37 66 C 30 44, 14 40, 8 28 C 24 30, 36 42, 37 66 z" fill="url(#hq-leaf)"/>
      <path d="M37 66 C 42 38, 56 30, 64 18 C 62 38, 50 50, 37 66 z" fill="url(#hq-leaf)"/>
      <path d="M37 66 C 36 46, 38 30, 36 10 C 46 28, 44 50, 37 66 z" fill="#3fa871"/>
    </g>
    <g filter="url(#hq-shadow)">
      <rect x="64" y="108" width="150" height="100" rx="9" fill="#cfd8dc"/>
      <rect x="71" y="115" width="136" height="86" rx="5" fill="url(#hq-screen)"/>
      <path d="M50 208 H228 l-12 18 H62 z" fill="#b8c4c9"/>
    </g>
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5">
      <text x="80" y="133" fill="#4ecdc4">zipwiki search</text>
      <text x="80" y="147" fill="#9fb4bd">florida-laws.zipwiki</text>
      <text x="80" y="161" fill="#ffd27a">"homestead exemption"</text>
      <rect x="80" y="172" width="7" height="11" fill="#4ecdc4"/>
    </g>
    <g filter="url(#hq-soft)">
      <path d="M0 0 h206 a14 14 0 0 1 14 14 v50 a14 14 0 0 1 -14 14 h-110 l-18 16 v-16 h-78 a14 14 0 0 1 -14 -14 v-50 a14 14 0 0 1 14 -14 z" fill="#fff" transform="translate(14 0)"/>
    </g>
    <text x="30" y="26" font-size="12" fill="#15202b" font-weight="600">Which laws cover the</text>
    <text x="30" y="44" font-size="12" fill="#15202b" font-weight="600">homestead exemption?</text>
    <text x="30" y="64" font-size="10" fill="#5a6b78">— you, to your agent</text>
  </g>

  <!-- ===== 2 RANK OKF ===== -->
  <g transform="translate(330 76)">
    <g filter="url(#hq-shadow)">
      <rect x="0" y="0" width="226" height="250" rx="14" fill="#fffaf1"/>
    </g>
    <text x="16" y="26" font-size="10" font-weight="700" letter-spacing="1.2" fill="#b45309">RANKED OKF HITS</text>
    <text x="16" y="42" font-size="9.5" fill="#5a6b78" font-family="'JetBrains Mono', ui-monospace, monospace">wiki/okf/index.md</text>
    <!-- hit 1 -->
    <g transform="translate(12 54)">
      <rect width="202" height="58" rx="9" fill="#fff" stroke="#e0a54b" stroke-width="2"/>
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#15202b">Ch. 2025-42</text>
      <rect x="12" y="28" width="98" height="13" rx="6.5" fill="#fde9c8"/>
      <text x="61" y="37.5" font-size="7.5" text-anchor="middle" fill="#b45309">tags: homestead</text>
      <rect x="116" y="28" width="58" height="13" rx="6.5" fill="#dff0ef"/>
      <text x="145" y="37.5" font-size="7.5" text-anchor="middle" fill="#0f6e6a">Session_Law</text>
      <rect x="12" y="47" width="150" height="4" rx="2" fill="#efe6d4"/><rect x="12" y="47" width="142" height="4" rx="2" fill="#14948e"/>
      <text x="190" y="20" font-size="10" font-weight="700" text-anchor="end" fill="#14948e">.94</text>
    </g>
    <!-- hit 2 -->
    <g transform="translate(12 120)">
      <rect width="202" height="58" rx="9" fill="#fff" stroke="#ead6b4"/>
      <text x="12" y="20" font-size="10.5" font-weight="700" fill="#15202b">Ch. 2024-168</text>
      <rect x="12" y="28" width="112" height="13" rx="6.5" fill="#fde9c8"/>
      <text x="68" y="37.5" font-size="7.5" text-anchor="middle" fill="#b45309">title: …exemptions</text>
      <rect x="12" y="47" width="150" height="4" rx="2" fill="#efe6d4"/><rect x="12" y="47" width="110" height="4" rx="2" fill="#14948e"/>
      <text x="190" y="20" font-size="10" font-weight="700" text-anchor="end" fill="#14948e">.71</text>
    </g>
    <!-- hit 3 (markdown, lower weight) -->
    <g transform="translate(12 186)" opacity=".75">
      <rect width="202" height="52" rx="9" fill="#f4f7f8" stroke="#c5d2d8" stroke-dasharray="4 3"/>
      <text x="12" y="20" font-size="10" font-weight="700" fill="#5a6b78">Ch. 2025-1</text>
      <text x="12" y="35" font-size="8" fill="#5a6b78">markdown match · lower weight</text>
      <rect x="12" y="41" width="150" height="4" rx="2" fill="#e4ecee"/><rect x="12" y="41" width="54" height="4" rx="2" fill="#9fb4bd"/>
      <text x="190" y="20" font-size="10" font-weight="700" text-anchor="end" fill="#9fb4bd">.38</text>
    </g>
  </g>

  <!-- ===== 3 STREAM SLICE ===== -->
  <g transform="translate(630 70)">
    <g filter="url(#hq-shadow)">
      <rect x="18" y="18" width="200" height="246" rx="10" fill="#e9f4f3" transform="rotate(4 118 140)"/>
      <rect x="10" y="10" width="200" height="250" rx="10" fill="#fff"/>
    </g>
    <path d="M20 10 h180 a10 10 0 0 1 10 10 v18 H10 v-18 a10 10 0 0 1 10 -10 z" fill="#0f6e6a"/>
    <text x="22" y="29" font-size="9.5" font-weight="700" fill="#fff" font-family="'JetBrains Mono', ui-monospace, monospace">wiki/parsed/Ch_2025-042.md</text>
    <!-- dimmed lines (not streamed) -->
    <g fill="#e4ecee">
      <rect x="22" y="52" width="150" height="5" rx="2.5"/><rect x="22" y="63" width="170" height="5" rx="2.5"/><rect x="22" y="74" width="130" height="5" rx="2.5"/>
      <rect x="22" y="214" width="160" height="5" rx="2.5"/><rect x="22" y="225" width="120" height="5" rx="2.5"/><rect x="22" y="236" width="150" height="5" rx="2.5"/>
    </g>
    <!-- streamed section -->
    <rect x="14" y="88" width="192" height="114" rx="8" fill="#e6fbf9" stroke="#4ecdc4" stroke-width="2"/>
    <text x="24" y="108" font-size="11" font-weight="700" fill="#0f6e6a" font-family="'JetBrains Mono', ui-monospace, monospace">## Sec. 3</text>
    <text x="96" y="108" font-size="10" font-weight="700" fill="#15202b">Homestead</text>
    <rect x="24" y="118" width="168" height="5" rx="2.5" fill="#9fb4bd"/>
    <rect x="22" y="128" width="172" height="15" rx="3" fill="#ffe7a8"/>
    <rect x="26" y="133" width="150" height="5" rx="2.5" fill="#b45309"/>
    <rect x="24" y="150" width="160" height="5" rx="2.5" fill="#9fb4bd"/>
    <rect x="24" y="161" width="140" height="5" rx="2.5" fill="#9fb4bd"/>
    <text x="24" y="190" font-size="8.5" fill="#0f6e6a" font-weight="600">≈ 1.8 KB streamed of 240 KB</text>
    <!-- bracket -->
    <path d="M216 90 h10 v110 h-10" fill="none" stroke="#14948e" stroke-width="2"/>
  </g>

  <!-- ===== 4 ANSWER ===== -->
  <g transform="translate(920 82)">
    <g filter="url(#hq-shadow)">
      <path d="M14 0 h212 a14 14 0 0 1 14 14 v196 a14 14 0 0 1 -14 14 h-150 l-20 18 v-18 h-42 a14 14 0 0 1 -14 -14 v-196 a14 14 0 0 1 14 -14 z" fill="#0f6e6a"/>
    </g>
    <circle cx="26" cy="26" r="13" fill="#e6fbf9"/>
    <path d="M26 16 Q27.6 24.4 36 26 Q27.6 27.6 26 36 Q24.4 27.6 16 26 Q24.4 24.4 26 16 z" fill="#14948e"/>
    <text x="48" y="31" font-size="11" font-weight="700" fill="#fff">Agent answer</text>
    <rect x="16" y="52" width="208" height="6" rx="3" fill="#dff0ef" opacity=".9"/>
    <rect x="16" y="64" width="190" height="6" rx="3" fill="#dff0ef" opacity=".9"/>
    <rect x="16" y="76" width="198" height="6" rx="3" fill="#dff0ef" opacity=".9"/>
    <rect x="16" y="88" width="120" height="6" rx="3" fill="#dff0ef" opacity=".9"/>
    <text x="16" y="116" font-size="8.5" font-weight="700" letter-spacing="1" fill="#9fe3dc">SOURCES IN THE PACKAGE</text>
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8.5">
      <rect x="16" y="124" width="190" height="22" rx="6" fill="#fffaf1"/>
      <circle cx="28" cy="135" r="4" fill="#b45309"/>
      <text x="38" y="138" fill="#7a3e06">okf/Ch_2025-042.md</text>
      <rect x="16" y="152" width="190" height="22" rx="6" fill="#e6fbf9"/>
      <circle cx="28" cy="163" r="4" fill="#14948e"/>
      <text x="38" y="166" fill="#0f6e6a">parsed/…042.md §3</text>
      <rect x="16" y="180" width="190" height="22" rx="6" fill="#eef3ff"/>
      <circle cx="28" cy="191" r="4" fill="#1d4ed8"/>
      <text x="38" y="194" fill="#1d4ed8">origin: flrules.org</text>
    </g>
  </g>

  <!-- step markers -->
  <g transform="translate(150 382)"><circle r="17" fill="#fff"/><circle r="14" fill="#0f6e6a"/><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text></g><g transform="translate(443 382)"><circle r="17" fill="#fff"/><circle r="14" fill="#0f6e6a"/><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text></g><g transform="translate(740 382)"><circle r="17" fill="#fff"/><circle r="14" fill="#0f6e6a"/><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text></g><g transform="translate(1040 382)"><circle r="17" fill="#fff"/><circle r="14" fill="#0f6e6a"/><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text></g>
</svg>
