<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="bz-title bz-desc" font-family="Sora, 'Segoe UI', system-ui, sans-serif">
  <title id="bz-title">Classic ZIP: unpack everything to read anything</title>
  <desc id="bz-desc">A plain archive.zip has burst open and dozens of PDFs, Word files and spreadsheets are spilled across the desk while a progress bar slowly unzips 240 MB. The agent asks which file it should even read.</desc>
  <defs>
    <linearGradient id="bz-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7ecee"/><stop offset="1" stop-color="#f2ede4"/>
    </linearGradient>
    <linearGradient id="bz-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6dccb"/><stop offset="1" stop-color="#d6c8af"/>
    </linearGradient>
    <linearGradient id="bz-box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a98c"/><stop offset="1" stop-color="#9c8b6e"/>
    </linearGradient>
    <filter id="bz-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1f3a44" flood-opacity=".14"/>
    </filter>
    <symbol id="bz-doc" viewBox="0 0 66 84">
      <path d="M6 0 h44 l16 16 v62 a6 6 0 0 1 -6 6 H6 a6 6 0 0 1 -6 -6 V6 a6 6 0 0 1 6 -6 z" fill="#fbfbf9"/>
      <path d="M50 0 v12 a4 4 0 0 0 4 4 h12" fill="#e2ddd2"/>
      <rect x="7" y="32" width="50" height="4" rx="2" fill="#cfd6d9"/><rect x="7" y="41" width="42" height="4" rx="2" fill="#cfd6d9"/><rect x="7" y="50" width="48" height="4" rx="2" fill="#cfd6d9"/>
    </symbol>
  </defs>
  <rect width="600" height="340" rx="22" fill="url(#bz-sky)"/>
  <path d="M0 220 H600 V318 a22 22 0 0 1 -22 22 H22 a22 22 0 0 1 -22 -22 z" fill="url(#bz-desk)"/>
  <rect x="0" y="216" width="600" height="6" fill="#dccfb8"/>

  <!-- open box -->
  <g transform="translate(220 120)" filter="url(#bz-soft)">
    <path d="M0 36 L80 18 L160 36 L80 54 z" fill="#7d6e55"/>
    <path d="M0 36 L80 54 V128 L0 110 z" fill="#8f7f63"/>
    <path d="M160 36 L80 54 V128 L160 110 z" fill="url(#bz-box)"/>
    <!-- flaps -->
    <path d="M0 36 L-30 6 L50 -12 L80 18 z" fill="#c7b89b"/>
    <path d="M160 36 L196 10 L116 -8 L80 18 z" fill="#c2b294"/>
    <text transform="translate(92 92) skewY(-12.7)" font-size="11" font-weight="700" fill="#5d5240">archive.zip</text>
  </g>

  <!-- spilled documents -->
  <g filter="url(#bz-soft)">
    <g transform="translate(30 208) rotate(-28)"><use href="#bz-doc" width="52" height="66"/><rect x="6" y="8" width="22" height="10" rx="2.5" fill="#c46a6a"/></g>
    <g transform="translate(92 236) rotate(12)"><use href="#bz-doc" width="52" height="66"/><rect x="6" y="8" width="22" height="10" rx="2.5" fill="#5f86c9"/></g>
    <g transform="translate(150 222) rotate(-6)"><use href="#bz-doc" width="52" height="66"/><rect x="6" y="8" width="22" height="10" rx="2.5" fill="#5f9e7a"/></g>
    <g transform="translate(214 254) rotate(22)"><use href="#bz-doc" width="52" height="66"/><rect x="6" y="8" width="22" height="10" rx="2.5" fill="#c46a6a"/></g>
    <g transform="translate(300 250) rotate(-16)"><use href="#bz-doc" width="52" height="66"/><rect x="6" y="8" width="22" height="10" rx="2.5" fill="#c98a5e"/></g>
    <g transform="translate(372 236) rotate(9)"><use href="#bz-doc" width="52" height="66"/><rect x="6" y="8" width="22" height="10" rx="2.5" fill="#5f86c9"/></g>
    <g transform="translate(436 252) rotate(-24)"><use href="#bz-doc" width="52" height="66"/><rect x="6" y="8" width="22" height="10" rx="2.5" fill="#c46a6a"/></g>
    <g transform="translate(500 226) rotate(14)"><use href="#bz-doc" width="52" height="66"/><rect x="6" y="8" width="22" height="10" rx="2.5" fill="#5f9e7a"/></g>
    <!-- docs flying out of box -->
    <g transform="translate(200 72) rotate(-30)" opacity=".85"><use href="#bz-doc" width="44" height="56"/></g>
    <g transform="translate(300 52) rotate(18)" opacity=".85"><use href="#bz-doc" width="44" height="56"/></g>
    <g transform="translate(360 96) rotate(34)" opacity=".85"><use href="#bz-doc" width="44" height="56"/></g>
  </g>

  <!-- progress bar -->
  <g transform="translate(24 24)" filter="url(#bz-soft)">
    <rect width="220" height="52" rx="12" fill="#fff"/>
    <text x="14" y="21" font-size="10.5" font-weight="700" fill="#5a6b78">Unzipping… 86 files</text>
    <text x="206" y="21" font-size="10" text-anchor="end" fill="#9aa8ae">240 MB</text>
    <rect x="14" y="31" width="192" height="8" rx="4" fill="#e4ecee"/>
    <rect x="14" y="31" width="70" height="8" rx="4" fill="#9aa8ae"/>
  </g>

  <!-- agent confused -->
  <g transform="translate(410 22)" filter="url(#bz-soft)">
    <path d="M12 0 h154 a12 12 0 0 1 12 12 v34 a12 12 0 0 1 -12 12 h-40 l-14 14 v-14 h-100 a12 12 0 0 1 -12 -12 v-34 a12 12 0 0 1 12 -12 z" fill="#fff"/>
  </g>
  <g transform="translate(410 22)">
    <circle cx="26" cy="29" r="13" fill="#eef1f2"/>
    <text x="26" y="34.5" text-anchor="middle" font-size="16" font-weight="800" fill="#9aa8ae">?</text>
    <text x="46" y="25" font-size="10.5" font-weight="700" fill="#15202b">Which file has</text>
    <text x="46" y="40" font-size="10.5" font-weight="700" fill="#15202b">the answer?</text>
  </g>
</svg>
