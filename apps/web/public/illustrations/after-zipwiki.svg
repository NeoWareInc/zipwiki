<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="az-title az-desc" font-family="Sora, 'Segoe UI', system-ui, sans-serif">
  <title id="az-title">ZipWiki: read one card, keep everything packed</title>
  <desc id="az-desc">On a bright desk the .zipwiki package stays closed. A beam of light lifts out one OKF card and one short markdown slice, about 2 KB, and the agent answers with a citation.</desc>
  <defs>
    <linearGradient id="az-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f3ef"/><stop offset=".6" stop-color="#f6fbf9"/><stop offset="1" stop-color="#fdf0d8"/>
    </linearGradient>
    <radialGradient id="az-sun" cx=".85" cy=".1" r=".5">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity=".95"/><stop offset="1" stop-color="#ffe7a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="az-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e7cf"/><stop offset="1" stop-color="#e7d4ae"/>
    </linearGradient>
    <linearGradient id="az-crate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1aa59e"/><stop offset="1" stop-color="#0f6e6a"/>
    </linearGradient>
    <linearGradient id="az-crate-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c5a57"/><stop offset="1" stop-color="#0f6e6a"/>
    </linearGradient>
    <linearGradient id="az-beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="az-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc28a"/><stop offset="1" stop-color="#2f8f5b"/>
    </linearGradient>
    <filter id="az-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1f3a44" flood-opacity=".18"/>
    </filter>
    <filter id="az-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1f3a44" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="600" height="340" rx="22" fill="url(#az-sky)"/>
  <rect width="600" height="340" rx="22" fill="url(#az-sun)"/>
  <g fill="#fff" opacity=".7"><ellipse cx="120" cy="54" rx="60" ry="12"/><ellipse cx="156" cy="44" rx="36" ry="14"/></g>
  <path d="M0 220 H600 V318 a22 22 0 0 1 -22 22 H22 a22 22 0 0 1 -22 -22 z" fill="url(#az-desk)"/>
  <rect x="0" y="216" width="600" height="6" fill="#e8d4ad"/>

  <!-- plant -->
  <g transform="translate(34 128)">
    <path d="M20 66 h32 l-5 36 h-22 z" fill="#d07a4c"/>
    <rect x="17" y="60" width="38" height="9" rx="3" fill="#c96e45"/>
    <path d="M36 62 C 28 40, 10 34, 2 20 C 20 22, 34 36, 36 62 z" fill="url(#az-leaf)"/>
    <path d="M36 62 C 42 34, 58 26, 68 12 C 66 34, 52 46, 36 62 z" fill="url(#az-leaf)"/>
    <path d="M36 62 C 34 40, 38 22, 34 2 C 46 22, 44 44, 36 62 z" fill="#3fa871"/>
  </g>

  <!-- beam -->
  <path d="M190 190 L216 40 H330 L356 190 z" fill="url(#az-beam)"/>

  <!-- package closed -->
  <g transform="translate(168 150)" filter="url(#az-shadow)">
    <path d="M0 30 L105 8 L210 30 L105 52 z" fill="#3fbdb5"/>
    <path d="M0 30 L105 52 V140 L0 118 z" fill="url(#az-crate-side)"/>
    <path d="M210 30 L105 52 V140 L210 118 z" fill="url(#az-crate)"/>
    <path d="M158 41 V128" stroke="#e8f7f5" stroke-width="5" stroke-dasharray="3 3"/>
    <rect x="151" y="66" width="14" height="22" rx="4" fill="#ffd27a" stroke="#b45309" stroke-width="1.5"/>
    <text transform="translate(18 90) skewY(11.8)" font-size="13" font-weight="700" fill="#dff0ef">.zipwiki</text>
  </g>

  <!-- lifted OKF card + md slice -->
  <g transform="translate(206 42) rotate(-6)" filter="url(#az-soft)">
    <rect width="86" height="64" rx="8" fill="#fffdf8" stroke="#e0a54b" stroke-width="2"/>
    <text x="9" y="16" font-size="7.5" font-weight="700" letter-spacing="1" fill="#b45309">OKF CARD</text>
    <text x="9" y="31" font-size="9.5" font-weight="700" fill="#15202b">Ch. 2025-1</text>
    <rect x="9" y="40" width="64" height="4" rx="2" fill="#d9c8a9"/><rect x="9" y="49" width="50" height="4" rx="2" fill="#d9c8a9"/>
  </g>
  <g transform="translate(276 72) rotate(7)" filter="url(#az-soft)">
    <rect width="66" height="50" rx="6" fill="#fff"/>
    <path d="M6 0 h54 a6 6 0 0 1 6 6 v6 H0 v-6 a6 6 0 0 1 6 -6 z" fill="#0f6e6a"/>
    <rect x="6" y="20" width="54" height="10" rx="2" fill="#ffe7a8"/><rect x="9" y="23" width="44" height="4" rx="2" fill="#b45309"/>
    <rect x="6" y="36" width="44" height="4" rx="2" fill="#c5d2d8"/>
  </g>
  <g fill="#ffc94d">
    <path d="M196 70 Q197.6 77 204 78.5 Q197.6 80 196 87 Q194.4 80 188 78.5 Q194.4 77 196 70 z"/>
    <path d="M356 54 Q357.4 60 363 61.5 Q357.4 63 356 69 Q354.6 63 349 61.5 Q354.6 60 356 54 z"/>
  </g>
  <!-- read meter chip -->
  <g transform="translate(206 300)">
    <rect width="134" height="26" rx="13" fill="#fff" opacity=".92"/>
    <text x="67" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#0f6e6a">~2 KB read · rest packed</text>
  </g>

  <!-- agent answer -->
  <g transform="translate(392 40)" filter="url(#az-shadow)">
    <path d="M14 0 h166 a14 14 0 0 1 14 14 v92 a14 14 0 0 1 -14 14 h-130 l-16 16 v-16 h-20 a14 14 0 0 1 -14 -14 v-92 a14 14 0 0 1 14 -14 z" fill="#0f6e6a"/>
  </g>
  <g transform="translate(392 40)">
    <circle cx="26" cy="26" r="13" fill="#e6fbf9"/>
    <path d="M26 16 Q27.6 24.4 36 26 Q27.6 27.6 26 36 Q24.4 27.6 16 26 Q24.4 24.4 26 16 z" fill="#14948e"/>
    <text x="48" y="24" font-size="11" font-weight="700" fill="#fff">Found it</text>
    <text x="48" y="38" font-size="9" fill="#9fe3dc">Chapter 2025-1</text>
    <rect x="14" y="52" width="164" height="6" rx="3" fill="#dff0ef" opacity=".9"/>
    <rect x="14" y="64" width="140" height="6" rx="3" fill="#dff0ef" opacity=".9"/>
    <rect x="14" y="84" width="120" height="20" rx="10" fill="#fffaf1"/>
    <circle cx="26" cy="94" r="4" fill="#b45309"/>
    <text x="36" y="97.5" font-size="8.5" fill="#7a3e06" font-family="'JetBrains Mono', ui-monospace, monospace">okf/Ch_2025-001</text>
  </g>
</svg>
