<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="ph-title ph-desc" font-family="Sora, 'Segoe UI', system-ui, sans-serif">
  <title id="ph-title">Documents packed into one .zipwiki an agent can read</title>
  <desc id="ph-desc">On a sunlit desk, a pile of PDFs, Word files, spreadsheets and scans flies into a single zippered .zipwiki package. On the right an AI agent reads one OKF card from the package and answers with a citation.</desc>
  <defs>
    <linearGradient id="ph-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2229"/><stop offset=".55" stop-color="#101a21"/><stop offset="1" stop-color="#221e17"/></linearGradient>
    <radialGradient id="ph-sun" cx=".72" cy=".42" r=".42"><stop offset="0" stop-color="#f3e9c6" stop-opacity=".35"/><stop offset=".35" stop-color="#4ecdc4" stop-opacity=".10"/><stop offset="1" stop-color="#4ecdc4" stop-opacity="0"/></radialGradient>
    <linearGradient id="ph-hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d4a40"/><stop offset="1" stop-color="#183a33"/></linearGradient>
    <linearGradient id="ph-hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f5b48"/><stop offset="1" stop-color="#1a4438"/></linearGradient>
    <linearGradient id="ph-desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3226"/><stop offset="1" stop-color="#2b251c"/></linearGradient>
    <linearGradient id="ph-crate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1aa59e"/><stop offset="1" stop-color="#0f6e6a"/>
    </linearGradient>
    <linearGradient id="ph-crate-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c5a57"/><stop offset="1" stop-color="#0f6e6a"/>
    </linearGradient>
    <radialGradient id="ph-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7d6" stop-opacity=".95"/><stop offset="1" stop-color="#fff7d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ph-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc28a"/><stop offset="1" stop-color="#2f8f5b"/>
    </linearGradient>
    <linearGradient id="ph-pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e08a5a"/><stop offset="1" stop-color="#b8603a"/>
    </linearGradient>
    <filter id="ph-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1f3a44" flood-opacity=".18"/>
    </filter>
    <filter id="ph-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1f3a44" flood-opacity=".14"/>
    </filter>
    <symbol id="ph-doc" viewBox="0 0 66 84">
      <path d="M6 0 h44 l16 16 v62 a6 6 0 0 1 -6 6 H6 a6 6 0 0 1 -6 -6 V6 a6 6 0 0 1 6 -6 z" fill="#fff"/>
      <path d="M50 0 v12 a4 4 0 0 0 4 4 h12" fill="#e7e0d1"/>
      <rect x="7" y="32" width="50" height="4" rx="2" fill="#c5d2d8"/><rect x="7" y="41" width="42" height="4" rx="2" fill="#c5d2d8"/><rect x="7" y="50" width="48" height="4" rx="2" fill="#c5d2d8"/>
    </symbol>
  </defs>

  <!-- window scene -->
  <rect width="1200" height="400" rx="28" fill="url(#ph-sky)"/><g fill="#fff" opacity=".55"><circle cx="90" cy="40" r="1.2"/><circle cx="180" cy="96" r="1"/><circle cx="340" cy="30" r="1.4"/><circle cx="470" cy="70" r="1"/><circle cx="560" cy="22" r="1.1"/><circle cx="700" cy="50" r="1.3"/><circle cx="820" cy="28" r="1"/><circle cx="960" cy="60" r="1.2"/><circle cx="1080" cy="34" r="1.4"/><circle cx="1150" cy="90" r="1"/></g>
  <rect width="1200" height="400" rx="28" fill="url(#ph-sun)"/>
  <circle cx="864" cy="168" r="46" fill="#fff4cc" opacity=".9"/>
  <g fill="#9fb4bd" opacity=".10">
    <ellipse cx="220" cy="70" rx="80" ry="16"/><ellipse cx="270" cy="58" rx="50" ry="20"/>
    <ellipse cx="620" cy="52" rx="64" ry="13"/><ellipse cx="1040" cy="84" rx="70" ry="14"/><ellipse cx="1080" cy="72" rx="40" ry="16"/>
  </g>
  <!-- birds -->
  <g fill="none" stroke="#5a6b78" stroke-width="2" stroke-linecap="round" opacity=".55">
    <path d="M700 96 q6 -6 12 0 q6 -6 12 0"/><path d="M736 80 q5 -5 10 0 q5 -5 10 0"/>
  </g>
  <path d="M0 250 C 160 196, 300 214, 440 236 S 760 186, 940 214 S 1140 230, 1200 210 V300 H0 z" fill="url(#ph-hill1)"/>
  <path d="M0 274 C 200 236, 380 256, 560 262 S 900 228, 1200 252 V300 H0 z" fill="url(#ph-hill2)"/>
  <!-- trees on hills -->
  <g fill="#3fa871">
    <path d="M140 246 l10 -26 l10 26 z"/><path d="M158 250 l8 -20 l8 20 z"/>
    <path d="M1010 236 l10 -26 l10 26 z"/><path d="M1030 240 l8 -20 l8 20 z"/>
  </g>
  <!-- window frame -->
  <g fill="#33404a">
    <rect x="0" y="0" width="1200" height="14"/>
    <rect x="592" y="0" width="16" height="292"/>
  </g>

  <!-- desk -->
  <path d="M0 286 H1200 V372 a28 28 0 0 1 -28 28 H28 a28 28 0 0 1 -28 -28 z" fill="url(#ph-desk)"/>
  <rect x="0" y="282" width="1200" height="8" fill="#463b2c"/>
  <g stroke="#4a3f2f" stroke-width="1.2" opacity=".7" fill="none">
    <path d="M30 322 Q300 314 560 324"/><path d="M640 334 Q900 322 1170 332"/><path d="M80 362 Q420 352 760 364"/>
  </g>

  <!-- plant -->
  <g transform="translate(40 168)">
    <path d="M26 80 h40 l-6 42 h-28 z" fill="url(#ph-pot)"/>
    <rect x="22" y="72" width="48" height="11" rx="3" fill="#c96e45"/>
    <path d="M46 74 C 36 46, 14 40, 4 22 C 26 26, 44 42, 46 74 z" fill="url(#ph-leaf)"/>
    <path d="M46 74 C 54 40, 72 30, 84 12 C 82 38, 64 54, 46 74 z" fill="url(#ph-leaf)"/>
    <path d="M46 74 C 44 48, 48 26, 44 0 C 58 24, 56 52, 46 74 z" fill="#3fa871"/>
    <path d="M46 74 C 30 60, 20 64, 10 56 C 26 50, 40 60, 46 74 z" fill="#5cc28a"/>
  </g>

  <!-- source pile on desk -->
  <g filter="url(#ph-soft)">
    <g transform="translate(150 214) rotate(-10)"><use href="#ph-doc" width="62" height="79"/><rect x="7" y="9" width="28" height="12" rx="3" fill="#1e8e4f"/><text x="21" y="18.5" font-size="7" font-weight="800" fill="#fff" text-anchor="middle">XLSX</text></g>
    <g transform="translate(212 220) rotate(8)"><rect width="70" height="82" rx="4" fill="#fbf7ee"/><rect x="6" y="6" width="58" height="54" fill="#e9dcc3"/><rect x="12" y="14" width="40" height="4" rx="2" fill="#a8977a"/><rect x="12" y="24" width="46" height="4" rx="2" fill="#a8977a"/><circle cx="48" cy="46" r="9" fill="none" stroke="#c0392b" stroke-width="2" opacity=".7"/></g>
    <g transform="translate(176 196) rotate(-3)"><use href="#ph-doc" width="62" height="79"/><rect x="7" y="9" width="28" height="12" rx="3" fill="#d64545"/><text x="21" y="18.5" font-size="7" font-weight="800" fill="#fff" text-anchor="middle">PDF</text></g>
  </g>

  <!-- flying docs arc into package -->
  <path d="M250 196 C 330 70, 470 60, 560 170" fill="none" stroke="#14948e" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity=".8"/>
  <g filter="url(#ph-soft)">
    <g transform="translate(272 118) rotate(-24)" opacity=".85"><use href="#ph-doc" width="50" height="64"/><rect x="6" y="7" width="23" height="10" rx="2.5" fill="#2b5fd9"/><text x="17.5" y="14.8" font-size="6" font-weight="800" fill="#fff" text-anchor="middle">DOCX</text></g>
    <g transform="translate(354 70) rotate(-8)" opacity=".92"><use href="#ph-doc" width="50" height="64"/><rect x="6" y="7" width="23" height="10" rx="2.5" fill="#d9662b"/><text x="17.5" y="14.8" font-size="6" font-weight="800" fill="#fff" text-anchor="middle">PPTX</text></g>
    <!-- turning into markdown mid-flight -->
    <g transform="translate(440 76) rotate(12)">
      <rect width="50" height="62" rx="6" fill="#fff"/>
      <path d="M6 0 h38 a6 6 0 0 1 6 6 v6 H0 v-6 a6 6 0 0 1 6 -6 z" fill="#0f6e6a"/>
      <text x="6" y="9.5" font-size="6.5" font-weight="700" fill="#fff" font-family="'JetBrains Mono', ui-monospace, monospace">.md</text>
      <rect x="6" y="20" width="30" height="4" rx="2" fill="#15202b"/><rect x="6" y="30" width="38" height="3" rx="1.5" fill="#c5d2d8"/><rect x="6" y="38" width="32" height="3" rx="1.5" fill="#c5d2d8"/><rect x="6" y="46" width="36" height="3" rx="1.5" fill="#c5d2d8"/>
    </g>
  </g>
  <!-- sparkles -->
  <g fill="#ffc94d">
    <path d="M410 54 Q412 62 420 64 Q412 66 410 74 Q408 66 400 64 Q408 62 410 54 z"/>
    <path d="M520 112 Q521.5 118 528 119.5 Q521.5 121 520 127 Q518.5 121 512 119.5 Q518.5 118 520 112 z"/>
  </g>

  <!-- package with glow -->
  <ellipse cx="640" cy="200" rx="170" ry="130" fill="url(#ph-glow)"/>
  <g transform="translate(530 150)" filter="url(#ph-shadow)">
    <path d="M0 40 L110 14 L220 40 L110 66 z" fill="#3fbdb5"/>
    <path d="M0 40 L110 66 V160 L0 134 z" fill="url(#ph-crate-side)"/>
    <path d="M220 40 L110 66 V160 L220 134 z" fill="url(#ph-crate)"/>
    <path d="M166 53 V146" stroke="#e8f7f5" stroke-width="6" stroke-dasharray="3.5 3.5"/>
    <rect x="158" y="80" width="16" height="26" rx="4" fill="#ffd27a" stroke="#b45309" stroke-width="1.5"/>
    <text transform="translate(22 104) skewY(13.3)" font-size="16" font-weight="700" fill="#dff0ef">.zipwiki</text>
    <text transform="translate(24 124) skewY(13.3)" font-size="9.5" fill="#9fe3dc">index · markdown · origins</text>
  </g>

  <!-- agent reading a card -->
  <path d="M760 198 C 790 150, 820 150, 846 176" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <g transform="translate(944 274)">
    <path d="M18 0 h32 l14 12 h-60 z" fill="#b8c4c9"/><rect x="-4" y="10" width="76" height="6" rx="3" fill="#9aa8ae"/>
  </g>
  <g transform="translate(860 116)" filter="url(#ph-shadow)">
    <rect x="-8" y="-8" width="266" height="176" rx="22" fill="#cfd8dc"/><rect width="250" height="160" rx="16" fill="#ffffff"/>
  </g>
  <g transform="translate(860 116)">
    <circle cx="28" cy="28" r="15" fill="#dff0ef"/>
    <path d="M28 17 Q29.8 26.2 39 28 Q29.8 29.8 28 39 Q26.2 29.8 17 28 Q26.2 26.2 28 17 z" fill="#14948e"/>
    <text x="52" y="25" font-size="12" font-weight="700" fill="#15202b">Your agent</text>
    <text x="52" y="40" font-size="9.5" fill="#5a6b78">reading 1 card, not 86 files</text>
    <g transform="translate(16 54)">
      <rect width="218" height="58" rx="10" fill="#fffaf1" stroke="#e0a54b" stroke-width="2"/>
      <text x="12" y="19" font-size="8.5" font-weight="700" letter-spacing="1" fill="#b45309">OKF CARD</text>
      <text x="12" y="36" font-size="11" font-weight="700" fill="#15202b">Chapter 2025-1, Laws of Florida</text>
      <rect x="12" y="43" width="62" height="10" rx="5" fill="#fde9c8"/><text x="43" y="50.5" font-size="6.5" text-anchor="middle" fill="#b45309">Session_Law</text>
      <rect x="80" y="43" width="54" height="10" rx="5" fill="#dff0ef"/><text x="107" y="50.5" font-size="6.5" text-anchor="middle" fill="#0f6e6a">florida · 2025</text>
    </g>
    <g transform="translate(16 122)">
      <rect width="148" height="26" rx="13" fill="#14948e"/>
      <path d="M14 13 l5 5 l9 -10" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17" font-size="9.5" font-weight="700" fill="#fff">Answer + citation</text>
    </g>
  </g>
  <!-- mug -->
  <g transform="translate(1136 242)">
    <path d="M2 4 h36 v36 a8 8 0 0 1 -8 8 h-20 a8 8 0 0 1 -8 -8 z" fill="#fff"/>
    <path d="M38 12 a10 10 0 0 1 0 20" fill="none" stroke="#e4ecee" stroke-width="5"/>
    <ellipse cx="20" cy="5" rx="18" ry="4" fill="#7a4a2a"/>
    <path d="M13 -6 q4 -6 0 -12 M24 -4 q4 -6 0 -12" stroke="#c5d2d8" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
